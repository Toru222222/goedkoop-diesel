name: Bronnen verkennen

# Handmatig: haalt een paar URL's op en toont status en begin van de inhoud,
# om nieuwe prijsbronnen te onderzoeken.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL's, gescheiden door spaties"
        required: true
      jq:
        description: "Optioneel jq-filter voor de laatste URL"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ophalen
        env:
          URLS: ${{ inputs.urls }}
          JQ: ${{ inputs.jq }}
        run: |
          for u in $URLS; do
            echo "=================== $u"
            curl -sS -L -m 40 -A "Mozilla/5.0 (goedkoop-diesel)" -D - -o body.bin "$u" | grep -iE "^HTTP|content-type|access-control-allow-origin|content-length" || true
            echo "--- grootte: $(wc -c < body.bin 2>/dev/null)"
            head -c 2500 body.bin 2>/dev/null; echo
          done
          if [ -n "$JQ" ]; then echo "=================== jq"; jq -r "$JQ" body.bin | head -c 60000; fi
