name: Open prijsdata bijwerken

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opendata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Vorige bestanden ophalen, zodat een land dat even faalt zijn laatste prijzen houdt.
      - name: Vorige prijzen ophalen
        run: |
          git clone --depth 1 --branch prices "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out || mkdir -p out
          rm -rf out/.git
      - run: node scripts/update-opendata.mjs
        env:
          DEBUG: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      # De branch "prices" bevat alleen de nieuwste bestanden, zonder geschiedenis.
      - name: Naar branch prices zetten
        working-directory: out
        run: |
          ls -la
          git init -q -b prices
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Prijzen $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prices
