name: Listprijzen bijwerken

on:
  schedule:
    - cron: '20 5,11,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-listprices.mjs
        env:
          DEBUG: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Wijzigingen opslaan
        run: |
          if git diff --quiet -- listprices.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add listprices.json
          git commit -m "Listprijzen bijgewerkt"
          git push
